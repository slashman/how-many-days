name: Publish

# Cutting a release is `npm version <minor|patch>` followed by
# `git push --follow-tags`: the tag push is what triggers this.
#
# Running it by hand instead (workflow_dispatch) does everything except the
# publish itself, as a way to prove the trusted-publishing setup still works
# without putting a throwaway version on the registry.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write # create the GitHub release
  id-token: write # OIDC token for npm trusted publishing

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      # Trusted publishing needs npm >= 11.5.1, and npm skips OIDC quietly
      # rather than failing when it can't do it. Node 24 ships a new enough npm,
      # so only step in when it doesn't — upgrading unconditionally would drag a
      # fresh npm major into the release path without anyone choosing it.
      - name: Ensure npm supports OIDC
        run: |
          required=11.5.1
          current="$(npm --version)"
          if [ "$(printf '%s\n%s\n' "$required" "$current" | sort -V | head -1)" != "$required" ]; then
            echo "npm $current is below $required, upgrading"
            npm install -g npm@latest
          fi
          npm --version

      # Everything that can fail runs before the publish, so a bad tag or a
      # missing changelog section costs nothing. There is no unpublishing.
      - name: Work out which version is being released
        id: version
        run: |
          pkg="$(node -p "require('./package.json').version")"
          if [ "${{ github.ref_type }}" = "tag" ]; then
            version="${GITHUB_REF_NAME#v}"
            if [ "$version" != "$pkg" ]; then
              echo "::error::tag $GITHUB_REF_NAME does not match package.json ($pkg)"
              exit 1
            fi
          else
            version="$pkg"
            echo "Dry run against $version — nothing will be published."
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Take the release notes from CHANGELOG.md
        run: |
          awk -v v="${{ steps.version.outputs.version }}" '
            $0 ~ "^## \\[" v "\\]" { f = 1; next }
            f && /^## \[/ { exit }
            f && /^\[/ { exit }
            f { print }
          ' CHANGELOG.md > "${RUNNER_TEMP}/notes.md"
          if [ ! -s "${RUNNER_TEMP}/notes.md" ]; then
            echo "::error::CHANGELOG.md has no section for ${{ steps.version.outputs.version }}"
            exit 1
          fi
          cat "${RUNNER_TEMP}/notes.md"

      # prepublishOnly runs these again; doing it here names the failing step.
      - run: npm test

      # No NODE_AUTH_TOKEN: npm exchanges the workflow's OIDC token for a
      # short-lived one, and turns on provenance by itself for a public package.
      - name: Publish to npm
        if: github.ref_type == 'tag'
        run: npm publish

      # npm does the same token exchange under --dry-run and skips only the
      # upload, so this exercises trusted publishing for real. oidc() swallows
      # its own failures, so assert on the line it logs rather than the exit
      # code — otherwise a broken setup would look like a pass.
      - name: Prove the OIDC exchange works, without publishing
        if: github.ref_type != 'tag'
        run: |
          out="$(npm publish --dry-run --loglevel verbose 2>&1)" && status=0 || status=$?
          echo "$out"

          if ! grep -q 'Successfully retrieved and set token' <<< "$out"; then
            echo "::error::npm never exchanged the OIDC token. Check the trusted publisher on npmjs.com: repo slashman/how-many-days, workflow publish.yml, no environment."
            exit 1
          fi

          # npm checks for an existing version after the exchange, so a dry run
          # of the version already released always ends here. That is the check
          # passing, not failing — anything else is a real problem.
          if [ "$status" -ne 0 ] &&
             ! grep -q 'cannot publish over the previously published versions' <<< "$out"; then
            echo "::error::dry run failed for some reason other than the version already existing."
            exit "$status"
          fi

          echo "Trusted publishing works: token exchanged, provenance enabled."

      - name: Publish the GitHub release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --notes-file "${RUNNER_TEMP}/notes.md"
          else
            gh release create "$GITHUB_REF_NAME" \
              --title "$GITHUB_REF_NAME" \
              --notes-file "${RUNNER_TEMP}/notes.md"
          fi
